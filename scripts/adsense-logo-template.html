<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 600px;
  height: 120px;
  background: transparent;
}
body {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 24px;
}
.logo-mark {
  flex-shrink: 0;
  display: block;
}
.logo-name {
  font-family: 'Big Shoulders', sans-serif;
  font-size: 44px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.01em;
  color: #0A0912;
  line-height: 1;
}
.logo-name em { font-style: normal; color: #FF3D8F; }
</style>
</head>
<body>
  <svg id="logo-mark" class="logo-mark" width="88" height="88" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="logo-name">json<em>tools</em></div>
</body>
</html>
