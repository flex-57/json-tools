<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@500;700;800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Fragment+Mono:ital@0;1&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  background: #0A0912;
  font-family: 'Public Sans', sans-serif;
  display: flex;
  flex-direction: column;
  padding: 56px 72px 48px;
  position: relative;
  overflow: hidden;
}

/* Dot grid background, matching the site's homepage backdrop */
.bg-dots {
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle, #1c1830 1.5px, transparent 1.5px);
  background-size: 26px 26px;
}

/* Accent bar */
.accent-bar {
  position: absolute;
  left: 0;
  top: 0;
  width: 6px;
  height: 100%;
  background: linear-gradient(180deg, #FF3D8F 0%, #C6FF3D 100%);
}

/* Giant decorative brackets, low-opacity depth layer — same treatment as
   the flagship homepage OG image (og-flagship-template.html), reused here
   so every tool card shares the same background texture. */
.deco {
  position: absolute;
  font-family: 'Fragment Mono', monospace;
  font-weight: 700;
  color: #FF3D8F;
  line-height: 1;
  user-select: none;
}
.deco-brace  { top: -160px; right: 60px;  font-size: 620px; opacity: 0.09; }
.deco-bracket-l { bottom: -210px; left: 360px; font-size: 460px; opacity: 0.08; }
.deco-bracket-r { top: 120px; right: -60px; font-size: 380px; opacity: 0.1; color: #C6FF3D; }

/* Floating editor window — optional per tool. Hidden unless the render
   script adds .window--visible and fills #window-body. When visible,
   .content gets a matching max-width so title/subtitle text doesn't run
   under it. */
.window {
  display: none;
  position: absolute;
  top: 210px;
  right: 68px;
  width: 460px;
  background: #100e1c;
  border: 1px solid #322c50;
  border-radius: 10px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.55);
  overflow: hidden;
  z-index: 2;
}
.window--visible { display: block; }
.window-bar { display: flex; align-items: center; gap: 6px; padding: 11px 14px; background: #0d0b17; border-bottom: 1px solid #26213d; }
.window-dot { width: 9px; height: 9px; border-radius: 50%; background: #322c50; }
.window-dot--accent { background: #FF3D8F; }
.window-body { padding: 18px 20px; font-family: 'Fragment Mono', monospace; font-size: 13px; line-height: 1.85; color: #EFE9F5; white-space: pre; }
.window-body .k { color: #8b85a3; }
.window-body .s { color: #9FCB78; }
.window-body .n { color: #A9ACE8; }
.window-body .b { color: #E0B75C; }
.window-body .p { color: #4a4460; }
.content.content--narrow { max-width: 560px; }
.content.content--narrow .subtitle { max-width: 560px; }

/* Header */
.header {
  display: flex;
  align-items: center;
  gap: 14px;
  position: relative;
  z-index: 1;
  margin-bottom: auto;
}
.logo-mark {
  flex-shrink: 0;
  display: block;
}
.logo-name {
  font-family: 'Big Shoulders', sans-serif;
  font-size: 21px;
  font-weight: 800;
  text-transform: uppercase;
  color: #EFE9F5;
  letter-spacing: 0.01em;
}
.logo-name em { font-style: normal; color: #FF3D8F; }

/* Main content */
.content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  z-index: 1;
  padding: 20px 0;
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #FF3D8F;
  margin-bottom: 24px;
}
.tag::before {
  content: '';
  display: block;
  width: 20px;
  height: 2px;
  background: #FF3D8F;
  border-radius: 1px;
}
.title {
  font-family: 'Big Shoulders', sans-serif;
  font-size: var(--title-size, 72px);
  font-weight: 800;
  text-transform: uppercase;
  color: #EFE9F5;
  line-height: 1.02;
  letter-spacing: 0.005em;
  margin-bottom: 24px;
  white-space: pre-line;
}
.subtitle {
  font-size: 22px;
  color: #8b85a3;
  font-weight: 400;
  line-height: 1.5;
  max-width: 680px;
}

/* Footer */
.footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid rgba(255,255,255,0.08);
  padding-top: 22px;
  position: relative;
  z-index: 1;
}
.footer-badges {
  display: flex;
  gap: 10px;
}
.badge {
  font-size: 11px;
  font-weight: 600;
  font-family: 'Fragment Mono', monospace;
  color: #6f688c;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 5px;
  padding: 4px 10px;
  letter-spacing: 0.04em;
}
.footer-url {
  font-size: 15px;
  color: #6f688c;
  font-family: 'Fragment Mono', monospace;
  font-weight: 500;
}
</style>
</head>
<body>
  <div class="bg-dots"></div>
  <div class="deco deco-brace">{</div>
  <div class="deco deco-bracket-l">[</div>
  <div class="deco deco-bracket-r">]</div>
  <div class="accent-bar"></div>

  <div class="header">
    <svg id="logo-mark" class="logo-mark" width="44" height="44" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="logo-name">json<em>tools</em></div>
  </div>

  <div class="content" id="content">
    <div class="tag" id="tag">JSON Tool</div>
    <div class="title" id="title" style="--title-size: 72px">JSON Formatter</div>
    <div class="subtitle" id="subtitle">Format, validate, and minify JSON instantly</div>
  </div>

  <div class="footer">
    <div class="footer-badges">
      <span class="badge">Free</span>
      <span class="badge">100% Client-Side</span>
      <span class="badge">No Signup</span>
    </div>
    <div class="footer-url">jsontools.space</div>
  </div>

  <div class="window" id="window">
    <div class="window-bar">
      <span class="window-dot"></span>
      <span class="window-dot"></span>
      <span class="window-dot window-dot--accent"></span>
    </div>
    <div class="window-body" id="window-body"></div>
  </div>
</body>
</html>
