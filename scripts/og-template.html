<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@500;700;800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Fragment+Mono:ital@0;1&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  background: #0A0912;
  font-family: 'Public Sans', sans-serif;
  display: flex;
  flex-direction: column;
  padding: 56px 72px 48px;
  position: relative;
  overflow: hidden;
}

/* Dot grid background, matching the site's homepage backdrop */
.bg-dots {
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle, #1c1830 1.5px, transparent 1.5px);
  background-size: 26px 26px;
}

/* Accent bar */
.accent-bar {
  position: absolute;
  left: 0;
  top: 0;
  width: 6px;
  height: 100%;
  background: linear-gradient(180deg, #FF3D8F 0%, #C6FF3D 100%);
}

/* Header */
.header {
  display: flex;
  align-items: center;
  gap: 14px;
  position: relative;
  z-index: 1;
  margin-bottom: auto;
}
.logo-mark {
  flex-shrink: 0;
  display: block;
}
.logo-name {
  font-family: 'Big Shoulders', sans-serif;
  font-size: 21px;
  font-weight: 800;
  text-transform: uppercase;
  color: #EFE9F5;
  letter-spacing: 0.01em;
}
.logo-name em { font-style: normal; color: #FF3D8F; }

/* Main content */
.content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  z-index: 1;
  padding: 20px 0;
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #FF3D8F;
  margin-bottom: 24px;
}
.tag::before {
  content: '';
  display: block;
  width: 20px;
  height: 2px;
  background: #FF3D8F;
  border-radius: 1px;
}
.title {
  font-family: 'Big Shoulders', sans-serif;
  font-size: var(--title-size, 72px);
  font-weight: 800;
  text-transform: uppercase;
  color: #EFE9F5;
  line-height: 1.02;
  letter-spacing: 0.005em;
  margin-bottom: 24px;
  white-space: pre-line;
}
.subtitle {
  font-size: 22px;
  color: #8b85a3;
  font-weight: 400;
  line-height: 1.5;
  max-width: 680px;
}

/* Footer */
.footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid rgba(255,255,255,0.08);
  padding-top: 22px;
  position: relative;
  z-index: 1;
}
.footer-badges {
  display: flex;
  gap: 10px;
}
.badge {
  font-size: 11px;
  font-weight: 600;
  font-family: 'Fragment Mono', monospace;
  color: #6f688c;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 5px;
  padding: 4px 10px;
  letter-spacing: 0.04em;
}
.footer-url {
  font-size: 15px;
  color: #6f688c;
  font-family: 'Fragment Mono', monospace;
  font-weight: 500;
}
</style>
</head>
<body>
  <div class="bg-dots"></div>
  <div class="accent-bar"></div>

  <div class="header">
    <svg id="logo-mark" class="logo-mark" width="44" height="44" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="logo-name">json<em>tools</em></div>
  </div>

  <div class="content">
    <div class="tag" id="tag">JSON Tool</div>
    <div class="title" id="title" style="--title-size: 72px">JSON Formatter</div>
    <div class="subtitle" id="subtitle">Format, validate, and minify JSON instantly</div>
  </div>

  <div class="footer">
    <div class="footer-badges">
      <span class="badge">Free</span>
      <span class="badge">100% Client-Side</span>
      <span class="badge">No Signup</span>
    </div>
    <div class="footer-url">jsontools.space</div>
  </div>
</body>
</html>
